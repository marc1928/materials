spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3306/product_db
    username: root
    password: marc
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      pool-name: MonPool
      auto-commit: true
      transaction-isolation: TRANSACTION_READ_COMMITTED

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
